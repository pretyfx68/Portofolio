<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akses Perangkat Habis</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:90%;
    max-width:450px;
    background:#1e293b;
    border:2px solid #ef4444;
    border-radius:18px;
    padding:30px;
    text-align:center;
    box-shadow:0 0 30px rgba(239,68,68,.35);
}

.icon{
    font-size:70px;
    margin-bottom:15px;
}

h1{
    color:#ef4444;
    font-size:28px;
    margin-bottom:15px;
}

p{
    color:#d1d5db;
    line-height:1.6;
    margin-bottom:25px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#ef4444;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#dc2626;
}
</style>
</head>
<body>

<div class="box">
    <div class="icon">⚠️</div>

    <h1>AKSES PERANGKAT ANDA TELAH HABIS</h1>

    <p>
        Masa akses perangkat ini telah berakhir.
        Silakan hubungi administrator atau lakukan
        perpanjangan akses untuk melanjutkan penggunaan layanan.
    </p>

    <button onclick="location.reload()">
        Coba Lagi
    </button>
</div>

</body>
</html>
