<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Access</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#0f172a;
    background-image:
    radial-gradient(circle at top,#2563eb20,transparent 45%),
    radial-gradient(circle at bottom,#0ea5e920,transparent 40%);
}

.box{
    width:360px;
    padding:32px;
    background:rgba(17,24,39,.88);
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    backdrop-filter:blur(15px);
    box-shadow:0 12px 30px rgba(0,0,0,.25);
}

.logo{
    width:60px;
    height:60px;
    margin:auto;
    margin-bottom:18px;
    border-radius:50%;
    background:#2563eb;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    font-size:22px;
}

h2{
    text-align:center;
    color:#fff;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    font-size:13px;
    margin-bottom:22px;
}

.input-group{
    position:relative;
    margin-bottom:15px;
}

.input-group i{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#94a3b8;
}

.input-group input{
    width:100%;
    height:48px;
    padding-left:45px;
    border-radius:10px;
    border:1px solid #374151;
    background:#111827;
    color:#fff;
    outline:none;
}

.input-group input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    height:48px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:15px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#1d4ed8;
}

.logout{
    background:#ef4444;
}

.logout:hover{
    background:#dc2626;
}

#error{
    color:#ef4444;
    text-align:center;
    margin-top:15px;
}

#confirmBox,
#webview{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:#fff;
    z-index:9999;
}

iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
}
</style>
</head>

<body>

<div class="box" id="loginBox">

<div class="logo">
<i class="fa-solid fa-shield-halved"></i>
</div>

<h2>Secure Access</h2>

<p class="subtitle">
Silakan login untuk melanjutkan
</p>

<div class="input-group">
<i class="fa-solid fa-user"></i>
<input type="text" id="nama" placeholder="Nama">
</div>

<div class="input-group">
<i class="fa-solid fa-key"></i>
<input type="password" id="key" placeholder="Kunci Akses">
</div>

<button onclick="login()">
<i class="fa-solid fa-arrow-right-to-bracket"></i>
 Masuk
</button>

<div id="error"></div>

</div>
<div class="box" id="confirmBox">

<div class="logo">
<i class="fa-solid fa-user-check"></i>
</div>

<h2>Selamat Datang</h2>

<p class="subtitle" id="welcome">
Lanjutkan sebagai
</p>

<button onclick="enterApp()">
<i class="fa-solid fa-arrow-right"></i>
 Masuk
</button>

<button class="logout" onclick="logout()">
<i class="fa-solid fa-right-from-bracket"></i>
 Logout
</button>

</div>

<div id="webview">
<iframe
id="frame"
src="https://pretyfx69.github.io/zain-multidevice.web.id">
</iframe>
</div>

<script>

const users = [

{
nama:"Zain",
key:"ApkMultifungsiKey:YrdevnkpdiYfcs"
},

{
nama:"Yadi Suryadi",
key:"ApkMultifungsiKey:Oaigwbsjsoxinwwppapiheenduxev"
}

];

window.onload=function(){

const login=localStorage.getItem("isLogin");
const username=localStorage.getItem("username");

if(login==="true"){

document.getElementById("loginBox").style.display="none";
document.getElementById("confirmBox").style.display="block";

document.getElementById("welcome").innerHTML=
"Lanjutkan sebagai <b>"+username+"</b>";

}

};
function login(){

const nama=document.getElementById("nama").value.trim().toLowerCase();
const key=document.getElementById("key").value.trim();

const user=users.find(function(u){
return u.nama.toLowerCase()===nama && u.key===key;
});

if(user){

localStorage.setItem("isLogin","true");
localStorage.setItem("username",user.nama);

document.getElementById("loginBox").style.display="none";
document.getElementById("confirmBox").style.display="block";

document.getElementById("welcome").innerHTML=
"Lanjutkan sebagai <b>"+user.nama+"</b>";

document.getElementById("error").innerHTML="";

}else{

document.getElementById("error").innerHTML=
"Nama atau Kunci Akses tidak valid.";

}

}

function enterApp(){

document.getElementById("confirmBox").style.display="none";
document.getElementById("webview").style.display="block";

}

function logout(){

localStorage.removeItem("isLogin");
localStorage.removeItem("username");

location.reload();

}

</script>

</body>
</html>
