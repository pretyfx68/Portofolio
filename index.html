<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Access</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#0f172a;
    background-image:
    radial-gradient(circle at top,#2563eb20,transparent 45%),
    radial-gradient(circle at bottom,#0ea5e920,transparent 40%);
}

.login-box{
    width:360px;
    padding:32px;
    background:rgba(17,24,39,.88);
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    backdrop-filter:blur(15px);
    box-shadow:0 12px 30px rgba(0,0,0,.25);
}

.logo{
    width:60px;
    height:60px;
    margin:auto;
    margin-bottom:18px;
    border-radius:50%;
    background:#2563eb;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    font-size:22px;
}

h2{
    text-align:center;
    color:#fff;
    font-size:24px;
    font-weight:600;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    font-size:13px;
    margin-top:6px;
    margin-bottom:24px;
}

.input-group{
    position:relative;
    margin-bottom:16px;
}

.input-group i{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#94a3b8;
}

.input-group input{
    width:100%;
    height:48px;
    padding-left:45px;
    border-radius:10px;
    border:1px solid #374151;
    background:#111827;
    color:#fff;
    font-size:14px;
    outline:none;
}

.input-group input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    height:48px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

button i{
    margin-right:8px;
}

#error{
    margin-top:15px;
    text-align:center;
    color:#ef4444;
    font-size:14px;
}

#webview{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>

<body>

<div class="login-box" id="loginBox">

<div class="logo">
<i class="fa-solid fa-shield-halved"></i>
</div>

<h2>Secure Access</h2>

<p class="subtitle">
Silakan login untuk melanjutkan
</p>

<div class="input-group">
<i class="fa-solid fa-user"></i>
<input type="text" id="nama" placeholder="Nama">
</div>

<div class="input-group">
<i class="fa-solid fa-key"></i>
<input type="password" id="key" placeholder="Kunci Akses">
</div>

<button onclick="login()">
<i class="fa-solid fa-arrow-right-to-bracket"></i>
Masuk
</button>

<div id="error"></div>

</div>

<div id="webview">
<iframe src="https://pretyfx69.github.io/zain-multidevice.web.id"></iframe>
</div>

<script>
const users = [
{
    nama:"Zain",
    key:"ApkMultifungsiKey:YrdevnkpdiYfcs"
},
{
    nama:"Yadi Suryadi",
    key:"ApkMultifungsiKey:Oaigwbsjsoxinwwppapiheenduxev"
}
];

// Cek login saat halaman dibuka
window.onload = function(){

    const isLogin = localStorage.getItem("isLogin");

    if(isLogin === "true"){
        document.getElementById("loginBox").style.display="none";
        document.getElementById("webview").style.display="block";
    }

};

function login(){

    const nama=document.getElementById("nama").value.trim();
    const key=document.getElementById("key").value.trim();

    const user=users.find(u=>u.nama===nama && u.key===key);

    if(user){

        // Simpan status login
        localStorage.setItem("isLogin","true");
        localStorage.setItem("username",user.nama);

        document.getElementById("loginBox").style.display="none";
        document.getElementById("webview").style.display="block";

    }else{

        document.getElementById("error").innerHTML="Nama atau kunci akses tidak valid.";

    }

}

// Fungsi logout (opsional)
function logout(){

    localStorage.removeItem("isLogin");
    localStorage.removeItem("username");

    location.reload();

}
</script>

</body>
</html>
